    <h1>Filmes anos 90</h1>
    <p>Atividade apresentando um filme dos anos 80 ou 90. E o escolhido foi o "Pulp Fiction"</p>
    <hr>
    <h2>Título: <em>Pulp Fiction</em></h2>
    <figure>
        <img src="imagem/poster.jpg" alt="poster pulp fiction" width="300" style="float: left; margin-right: 15px;">
        <figcaption>Categoria: Gângster, Crime, Drama, Comédia de humor negro<br>Ano de lançamento: 1994<br>Classificação: 18 anos</figcaption>
        <hr>
        <h2>Sinopse</h2>
        <p>Dirigido por Quentin Tarantino, Pulp Fiction: Tempo de Violência é um clássico moderno que entrelaça as vidas de criminosos, assassinos de aluguel e figuras marginais de Los Angeles por meio de diálogos icônicos, humor ácido e uma estrutura não linear. Em vez de uma história contínua, o filme acompanha momentos marcantes da rotina de personagens como dois capangas filosóficos, a enigmática esposa de um chefão do crime e um boxeador em fuga, explorando o submundo do crime com muito estilo, ironia e uma trilha sonora lendária.</p>
    </figure>
